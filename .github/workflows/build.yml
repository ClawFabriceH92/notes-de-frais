name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTESDEFRAIS_KEYSTORE_B64: ${{ secrets.NOTESDEFRAIS_KEYSTORE_B64 }}
      NOTESDEFRAIS_KEYSTORE_PASSWORD: ${{ secrets.NOTESDEFRAIS_KEYSTORE_PASSWORD }}
      NOTESDEFRAIS_KEY_PASSWORD: ${{ secrets.NOTESDEFRAIS_KEY_PASSWORD }}
      NOTESDEFRAIS_KEY_ALIAS: ${{ secrets.NOTESDEFRAIS_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list still asks for "tools", which Google
      # removed from the SDK repository: sdkmanager would exit 1 before any
      # compilation. Only what this build needs is listed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # "0 tests found" also exits 0, which would make this job a decorative
      # green tick.
      - name: Assert unit tests actually ran
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          total = sum(int(ET.parse(f).getroot().get('tests', 0)) for f in files)
          print(f'{len(files)} classe(s) de test, {total} test(s) unitaires')
          if total < 20:
              sys.exit(f'Trop peu de tests exécutés ({total})')
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-de-frais-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/release/app-release.apk
          # Create once, then overwrite the asset in place so the download URL
          # never 404s between two builds.
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Notes de frais v${VER}" --notes "Build automatique - v${VER}"
          gh release edit latest --title "Notes de frais v${VER}" --notes "Build automatique - v${VER}"
          for i in 1 2 3 4 5; do
            gh release upload latest "$APK" --clobber && break
            sleep 10
          done
          # Published after the APK so the manifest never advertises a build
          # whose asset is not up yet. The updater reads this asset instead of
          # the releases API: an asset download has no per-IP hourly quota.
          printf '{"version":"%s","notes":"Build automatique - v%s","apk":"%s"}\n' \
            "$VER" "$VER" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/app-release.apk" \
            > "$RUNNER_TEMP/version.json"
          for i in 1 2 3 4 5; do
            gh release upload latest "$RUNNER_TEMP/version.json" --clobber && break
            sleep 10
          done
          # A rolling release accumulates assets; a stale APK left behind is
          # what makes the updater install an older version.
          gh release view latest --json assets -q '.assets[].name' \
            | grep -vx -e 'app-release.apk' -e 'version.json' \
            | while read -r stale; do gh release delete-asset latest "$stale" -y || true; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
